# QA Mini — docker compose 部署
# 用法（在本目录执行）:
#   docker compose up -d --build
# 首次启动自动: 生成 config.json、创建 data/qa-mini.db、建「默认会话」。
# 端口: 宿主机端口自行选择（下方 "8790:8787" 左侧即宿主机端口）。
services:
  qa-mini:
    build:
      context: ..                # 项目根（server.js / lib / public）
      dockerfile: docker/Dockerfile
    image: qa-mini:latest
    container_name: qa-mini
    restart: unless-stopped
    ports:
      - "8790:8787"              # ← 宿主机端口:容器端口（按环境改左侧）
    volumes:
      # 注意: 本文件位于 docker/ 子目录，相对路径以本文件所在目录为基准
      - ../data:/app/data        # 会话数据库与运行时配置持久化（项目根下 data/）
    environment:
      - NODE_NO_WARNINGS=1
      # 配置落数据卷：容器重建/镜像升级不丢配置（与 qa-mini.db 同卷，备份 data/ 即全量）
      - QA_MINI_CONFIG=/app/data/config.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选 https 入口（网页「语音输入」需要安全上下文）：docker compose --profile tls up -d
  # 默认不启动，不影响现有 http 入口；首次启动自动生成自签证书（落 ../data/qa-tls/）。
  # 详见 doc/03 §8；改服务器 IP → 改 TLS_SAN 并删除 data/qa-tls/ 证书后重启。
  qa-mini-tls:
    build:
      context: .                 # docker/ 目录（Dockerfile 在 tls/ 子目录）
      dockerfile: tls/Dockerfile
    image: qa-mini-tls:latest
    container_name: qa-mini-tls
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "8443:443"               # ← 宿主机 https 端口（按环境改左侧）
    environment:
      # 证书 SAN（IP:..,DNS:.. 逗号分隔；按实际服务器 IP 设置）
      - TLS_SAN=IP:127.0.0.1,DNS:localhost
    volumes:
      - ../data/qa-tls:/certs
      - ./tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: ["/entrypoint.sh"]
    depends_on:
      - qa-mini
