# EchoAnswer https 入口（网页语音输入需要安全上下文；配置见 doc/03 §8）
# 双 server 设计：443（LAN 直连 / docker-proxy，源地址由内核 DNAT 保留）与
# 8444（19002 中继隧道专用，PROXY 头由 appserver 中继重注入真实客户端 IP）。
# 关键：nginx HTTP 模块下 PROXY 头客户端地址在 $proxy_protocol_addr（$remote_addr
# 恒为 socket 对端 = frpc 拨号源 172.21.0.1，实测 nginx 1.27.5），故 PP server 块的
# XFF 必须取 $proxy_protocol_addr（101 实测 2026-10-09，doc/04 §8）。
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/echoanswer.crt;
    ssl_certificate_key /certs/echoanswer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WAV 上传（浏览器录音 ≤60s ≈ 1.9MB，12m 留足余量，与服务端 10MB 上限匹配）
    client_max_body_size 12m;

    location = /api/audio/stream {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 请求体两次读取间隔：默认 60s 会把「客户端长时间无帧」的长连接断掉
        # （408 Request Timeout，101 实测）；此处对齐 3600s，服务端以
        # audio_stream.idle_clean_s（默认 60s 无帧清理）兜底
        client_body_timeout 3600s;
        proxy_send_lowat 0;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 实时（问答流式广播）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}

# frp 中继隧道专用（frps:19005 → 101 frpc web-8444（字节透明）→ 本端口 8444；
# PROXY 头由 appserver 中继从 frpc:19002 一跳读到真实客户端 IP 后重新注入，见
# doc/03 §8「19002 旧公网入口真实 IP 链路」）。未带 PROXY 头的连接被 nginx
# 直接断开。XFF / X-Real-IP 取 $proxy_protocol_addr。
# （8443 监听已于 2026-10-10 随 19004 直连入口释放而移除，见 doc/04 §8）
server {
    listen 8444 ssl proxy_protocol;
    server_name _;

    ssl_certificate     /certs/echoanswer.crt;
    ssl_certificate_key /certs/echoanswer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location = /api/audio/stream {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For   $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 请求体两次读取间隔：默认 60s 会把「客户端长时间无帧」的长连接断掉
        # （408 Request Timeout，101 实测）；此处对齐 3600s，服务端以
        # audio_stream.idle_clean_s（默认 60s 无帧清理）兜底
        client_body_timeout 3600s;
        proxy_send_lowat 0;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For   $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 实时（问答流式广播）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}
