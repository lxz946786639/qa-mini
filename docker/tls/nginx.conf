# EchoAnswer https 入口（网页语音输入需要安全上下文；配置见 doc/03 §8）
server {
    listen 443 ssl;
    # frp 公网入口专用（公网 frps 端口 → frpc → 本端口；frpc 端 frp ≥0.56 配置
    # transport.proxyProtocolVersion = "v1" → PROXY protocol v1 头携带真实客户端 IP，
    # $remote_addr 还原为终端用户地址）。真实 IP 仅在 frps 同 ≥0.56 时可得（frps 旧版
    # 不向 frpc 提供客户端地址，frpc 写 127.0.0.1，见 doc/03 §8「frp 公网入口」）。
    # 仅供 frpc 直连（sidecar 容器 IP:8443）；未带 PROXY 头的连接被 nginx 直接断开。
    listen 8443 ssl proxy_protocol;
    server_name _;

    ssl_certificate     /certs/echoanswer.crt;
    ssl_certificate_key /certs/echoanswer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WAV 上传（浏览器录音 ≤60s ≈ 1.9MB，12m 留足余量，与服务端 10MB 上限匹配）
    client_max_body_size 12m;

    # 电脑输出音频推流（EchoScribe 持续推流 → /api/audio/stream，长连接 chunked POST，
    # 可持续数小时）：必须关闭请求缓冲、不限请求体大小，否则 nginx 默认把
    # 请求体缓冲到磁盘（12m 上限）后才会转发，直接打断长流。
    # 服务端「先回 200 再读体」，故响应即时到达，read/send 超时仅作兜底。
    location = /api/audio/stream {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_send_lowat 0;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 实时（问答流式广播）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}
