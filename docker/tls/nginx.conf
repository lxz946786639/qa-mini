# EchoAnswer https 入口（网页语音输入需要安全上下文；配置见 doc/03 §8）
# 双 server 设计：443（LAN 直连 / docker-proxy，源地址由内核 DNAT 保留）与
# 8443（frp 公网入口专用，PROXY protocol v1 头由 frpc 写入）。
# 关键：nginx HTTP 模块下 PROXY 头客户端地址在 $proxy_protocol_addr（$remote_addr
# 恒为 socket 对端 = frpc 拨号源 172.21.0.1，实测 nginx 1.27.5），故 8443 的
# XFF 必须取 $proxy_protocol_addr（101 实测 2026-10-09，doc/04 §8）。
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/echoanswer.crt;
    ssl_certificate_key /certs/echoanswer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WAV 上传（浏览器录音 ≤60s ≈ 1.9MB，12m 留足余量，与服务端 10MB 上限匹配）
    client_max_body_size 12m;

    location = /api/audio/stream {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_send_lowat 0;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 实时（问答流式广播）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}

# frp 公网入口专用（公网 frps 端口 → frpc → 本端口；frpc 端 frp ≥0.56 配置
# transport.proxyProtocolVersion = "v1" → PROXY protocol v1 头携带真实客户端 IP；
# frps 须同 ≥0.56 才能提供真实客户端地址，旧版 frps 下头内为 127.0.0.1，见
# doc/03 §8「frp 公网入口」）。仅供 frpc 直连（sidecar 容器 IP:8443）；未带
# PROXY 头的连接被 nginx 直接断开。XFF / X-Real-IP 取 $proxy_protocol_addr。
server {
    listen 8443 ssl proxy_protocol;
    # 8444 = 19002 中继专用隧道（frps:19005 → 本口，frpc 侧字节透明；
    # PROXY 头由 appserver 中继从 frpc:19002 一跳读到后重新注入，见 doc/03 §8）
    listen 8444 ssl proxy_protocol;
    server_name _;

    ssl_certificate     /certs/echoanswer.crt;
    ssl_certificate_key /certs/echoanswer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location = /api/audio/stream {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For   $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_send_lowat 0;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://echoanswer:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For   $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 实时（问答流式广播）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}
